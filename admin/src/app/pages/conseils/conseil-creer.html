<app-en-tete titre="Ajouter un conseil" sousTitre="Publié directement, sans modération" />

<div class="contenu">
  <app-retour lien="/conseils" texte="Retour à la modération" />

  <form class="carte carte-formulaire" [formGroup]="formulaire" (ngSubmit)="publier()" novalidate>
    <div class="grille-champs">
      <div class="champ">
        <label for="filiere">Filière cible</label>
        <select id="filiere" formControlName="filiere" appChamp>
          @for (f of filieres; track f) { <option [ngValue]="f">{{ libelleFiliere(f) }}</option> }
        </select>
      </div>
      <div class="champ">
        <label for="categorie">Catégorie</label>
        <select id="categorie" formControlName="categorie">
          @for (c of categories; track c) { <option [ngValue]="c">{{ libelleCategorie[c] }}</option> }
        </select>
      </div>
      <div class="champ large" [class.invalide]="formulaire.controls.titre.touched && formulaire.controls.titre.invalid">
        <label for="titre">Titre</label>
        <input id="titre" formControlName="titre" appChamp maxlength="160" placeholder="Prévenir la coccidiose en saison des pluies" />
      </div>
      <div class="champ large" [class.invalide]="formulaire.controls.contenu.touched && formulaire.controls.contenu.invalid">
        <label for="contenu">Contenu</label>
        <textarea id="contenu" formControlName="contenu" appChamp rows="5" style="height: 150px"
          placeholder="Adressez-vous à l'éleveur, en phrases courtes"></textarea>
      </div>
    </div>

    <div class="encadre">Visible aussitôt par les éleveurs de la filière choisie. D'ordinaire, ce sont les vétérinaires qui rédigent.</div>

    @if (erreur(); as e) { <div class="message-erreur" id="erreur-formulaire" role="alert">{{ e }}</div> }
    <div class="actions-formulaire">
      <button type="submit" class="bouton bouton-primaire" [disabled]="envoi()">Publier le conseil</button>
      <button type="button" class="bouton bouton-contour" (click)="annuler()">Annuler</button>
    </div>
  </form>
</div>
