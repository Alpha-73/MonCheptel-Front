name: moncheptel
description: Application eleveur et veterinaire MonCheptel.
publish_to: 'none'
version: 1.0.0+4

environment:
  # Large a dessein : une mise a jour de Flutter ne doit pas casser le build
  # a quelques jours de la soutenance. Dart 3 est exige (records, switch
  # d'expressions, `abstract final class`).
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # Selecteur de date et textes systeme en francais.
  flutter_localizations:
    sdk: flutter

  # Client HTTP. `http` plutot que `dio` : moins de surface, suffisant pour
  # une API REST, et une dependance de moins a expliquer au jury.
  http: ^1.2.1

  # Jetons de session. Le jeton de rafraichissement vaut 30 jours d'acces :
  # il va dans le stockage chiffre du systeme (Keystore Android, Keychain
  # iOS), pas dans des preferences en clair.
  flutter_secure_storage: ^9.2.2

  # Boutons « Appeler » : ouvre le composeur du telephone.
  url_launcher: ^6.2.6

  # Notifications poussees (pousse/pousse.dart) : un nouveau cas arrive chez
  # le veterinaire, la reponse chez l'eleveur, meme application fermee.
  # Sans android/app/google-services.json, l'application marche sans elles.
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # Gestion d'etat : AUCUNE bibliotheque. Chaque ecran charge ses donnees
  # (FutureBuilder) et se recharge apres une modification. C'est suffisant a
  # cette taille, et chaque ligne s'explique sans prerequis.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Logo et embleme, tires du SVG du logo (maquettes/logo).
  assets:
    - assets/marque/

  # Polices embarquees (licence SIL OFL, voir assets/polices/OFL-*.txt),
  # reduites au jeu latin : l'appli ne depend d'aucun telechargement.
  #  - Baloo 2 : titres et chiffres, ronde et chaleureuse.
  #  - Nunito : corps de texte, tres lisible en petit.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/polices/Nunito-Regular.ttf
          weight: 400
        - asset: assets/polices/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/polices/Nunito-Bold.ttf
          weight: 700
        - asset: assets/polices/Nunito-ExtraBold.ttf
          weight: 800
    - family: Baloo2
      fonts:
        - asset: assets/polices/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/polices/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/polices/Baloo2-ExtraBold.ttf
          weight: 800
